<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>依赖升级分析 · ContiNew Starter</title>
<style>
  :root{
    --bg:#f4f5fa; --bg-grad-top:#eef1fb; --card:#ffffff; --ink:#1b2131; --sub:#6b7280;
    --line:#e6e9f2; --line-soft:#eef0f6;
    --green:#16a34a; --yellow:#d97706; --red:#dc2626; --grey:#8a91a6; --blue:#4f6ef7;
    --green-bg:#e9f9ef; --yellow-bg:#fdf3e7; --red-bg:#fdedeb; --grey-bg:#f1f2f7; --blue-bg:#eef1fe;
    --green-line:#b6e6c8; --yellow-line:#f3d9ac; --red-line:#f6c4c0;
    --accent:#4f6ef7; --accent-2:#7c5cff; --accent-bg:#eef1fe; --accent-line:#cfd8fe;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(28,32,56,.04),0 10px 30px -12px rgba(28,32,56,.12);
    --shadow-lg:0 4px 12px rgba(28,32,56,.05),0 22px 48px -20px rgba(79,110,247,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--bg-grad-top),var(--bg) 340px);color:var(--ink);
    line-height:1.65;padding:0 0 80px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  button{font-family:inherit}

  /* ---------- header ---------- */
  header{padding:40px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-logo{width:44px;height:44px;border-radius:13px;flex-shrink:0;position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 18px -6px rgba(79,110,247,.55)}
  .brand-logo svg{position:absolute;inset:0;width:60%;height:60%;margin:auto;fill:#fff}
  .brand h1{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
  .brand p{font-size:12.5px;color:var(--sub);margin-top:2px}
  .meta{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right;
    background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:10px;box-shadow:var(--shadow)}
  .meta div{margin:1px 0}
  .header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .export-btn{border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:800;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#34d399,#16a34a);color:#fff;
    box-shadow:0 6px 14px -6px rgba(22,163,74,.55);transition:.15s;white-space:nowrap}
  .export-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}

  /* ---------- overview hero ---------- */
  .overview{position:relative;background:linear-gradient(135deg,#ffffff 0%,#f7f9ff 100%);
    border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);
    padding:26px 28px 22px;margin-bottom:26px;overflow:hidden}
  .overview::before{content:"";position:absolute;top:-70px;right:-70px;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(79,110,247,.14),transparent 65%)}
  .overview > *{position:relative;z-index:1}
  .lead{font-size:14px;line-height:1.7;color:#3d4356;margin-bottom:18px}
  .lead b{color:var(--ink)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:16px 18px;
    box-shadow:0 2px 8px -4px rgba(28,32,56,.08);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
  .stat:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(28,32,56,.18)}
  .stat .k{font-size:12px;color:var(--sub);font-weight:600}
  .stat .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-top:6px;line-height:1}
  .stat.total .v{color:var(--blue)} .stat.out .v{color:var(--red)}
  .stat.ok .v{color:var(--green)} .stat.major .v{color:var(--yellow)}
  .bar{height:18px;border-radius:10px;background:#eef0f6;overflow:hidden;display:flex;margin:2px 0 14px;box-shadow:inset 0 1px 2px rgba(28,32,56,.06)}
  .bar i{display:block;height:100%;transition:width .6s ease}
  .bar i.seg-green{background:linear-gradient(180deg,#22c55e,var(--green))}
  .bar i.seg-yellow{background:linear-gradient(180deg,#f59e0b,var(--yellow))}
  .bar i.seg-red{background:linear-gradient(180deg,#ef4444,var(--red))}
  .bar i.seg-grey{background:linear-gradient(180deg,#a5abc0,var(--grey))}
  .bar i.seg-blue{background:linear-gradient(180deg,#6f8bff,var(--blue))}
  .bar i+i{border-left:2px solid #fff}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:22px;padding:7px 14px;font-size:12.5px;font-weight:600;box-shadow:0 1px 3px rgba(28,32,56,.05)}
  .pill b{font-variant-numeric:tabular-nums;background:var(--grey-bg);border-radius:20px;padding:1px 9px;font-size:12px}
  .pill.g b{color:var(--green);background:var(--green-bg)}
  .pill.y b{color:var(--yellow);background:var(--yellow-bg)}
  .pill.r b{color:var(--red);background:var(--red-bg)}
  .pill.b b{color:var(--blue);background:var(--blue-bg)}
  .offline-warn{background:var(--yellow-bg);border:1px solid var(--yellow-line);border-radius:12px;
    padding:11px 16px;font-size:13px;margin-top:16px;color:#7a4a02;font-weight:500}
  .sysgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 24px;
    margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
  .sysgrid div{font-size:13px;color:#3d4356}
  .sysgrid span{color:var(--sub);font-size:12px}

  /* ---------- sections ---------- */
  .sec{margin-bottom:30px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:17px;font-weight:800;letter-spacing:-.2px}
  .sec-head .count{font-size:12.5px;color:var(--sub);font-weight:600;background:var(--grey-bg);padding:2px 10px;border-radius:20px}
  .summary{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px 24px;border:1px solid var(--line)}
  .summary ul{padding-left:20px} .summary li{margin:7px 0;font-size:13.5px;color:#3d4356}
  .summary li::marker{color:var(--accent)}

  /* ---------- tabs: hairline segment strip (no emoji, no gradient) ---------- */
  .tabs{position:sticky;top:0;z-index:30;background:rgba(248,250,252,.94);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);margin:0 -22px 20px;padding:0 22px;
    border-bottom:1px solid var(--line);display:flex;gap:0;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
  .tabs::-webkit-scrollbar{height:3px}
  .tabs::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
  .tab{background:transparent;border:none;padding:14px 13px 12px;font-size:13px;font-weight:500;color:var(--sub);
    cursor:pointer;position:relative;transition:color .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
  .tab:not(:first-child){border-left:1px solid var(--line)}
  .tab b{font-variant-numeric:tabular-nums;font-size:11px;color:var(--sub);font-weight:500}
  .tab:hover{color:var(--ink)}
  .tab::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:transparent;transition:background .15s}
  .tab.on{color:var(--ink);font-weight:700}
  .tab.on b{color:var(--accent);font-weight:700}
  .tab.on[data-t="patch"] b{color:var(--green)}
  .tab.on[data-t="minor"] b{color:var(--yellow)}
  .tab.on[data-t="major"] b{color:var(--red)}
  .tab.on[data-t="ok"] b{color:var(--blue)}
  .tab.on[data-t="other"] b{color:var(--grey)}
  .tab.on::after{background:var(--accent)}
  .tab.on[data-t="patch"]::after{background:var(--green)}
  .tab.on[data-t="minor"]::after{background:var(--yellow)}
  .tab.on[data-t="major"]::after{background:var(--red)}
  .tab.on[data-t="ok"]::after{background:var(--blue)}
  .tab.on[data-t="other"]::after{background:var(--grey)}

  .pane{display:none}
  .pane.on{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pane-hint{font-size:12.5px;color:var(--sub);margin-bottom:16px;line-height:1.7}
  .empty{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);
    padding:44px 24px;text-align:center;color:var(--sub);font-size:14px}
  .empty .big{font-size:36px;margin-bottom:8px}

  /* ---------- item cards: flat, hairline, monospace version line ---------- */
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin-bottom:12px;overflow:hidden;cursor:pointer;transition:border-color .18s,box-shadow .18s;position:relative}
  .item:hover{border-color:#cbd5e1;box-shadow:0 2px 10px -6px rgba(15,23,42,.12)}
  .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--grey);z-index:2}
  .item.green::before{background:var(--green)}
  .item.yellow::before{background:var(--yellow)}
  .item.red::before{background:var(--red)}
  .item.grey::before{background:var(--grey)}
  .item.open{border-color:#cbd5e1;box-shadow:0 2px 10px -6px rgba(15,23,42,.12)}
  .item.applied .item-name{text-decoration:line-through;color:var(--sub);font-weight:600}
  .item.applied{opacity:.82;border-color:var(--green-line)}
  .item.applied::before{background:var(--green)}
  .item.in-cart{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line) inset}
  .item.in-cart::before{background:var(--accent)}
  .item.in-cart .pick{opacity:.65}
  /* status label shown to the RIGHT of the dependency name, where the eye lands
     after reading the name */
  .name-line{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .cart-state{font-size:10.5px;font-weight:700;line-height:1.4;flex-shrink:0;
    max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .2s,opacity .2s,color .2s;
    color:var(--green);background:var(--green-bg);border:1px solid var(--green-line);
    border-radius:6px;padding:0 0}
  .cart-state.on{max-width:220px;opacity:1;padding:1px 7px}
  .cart-state.applied{color:var(--blue);background:var(--blue-bg);border-color:var(--accent-line);max-width:220px;opacity:1;padding:1px 7px}
  .pick[disabled]{cursor:not-allowed;opacity:.4}

  /* header row */
  .item-head{display:flex;align-items:center;gap:14px;padding:16px 16px 6px 20px;cursor:pointer;user-select:none}
  .item-id{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .item-name{font-weight:600;font-size:15px;line-height:1.3;word-break:break-all;color:var(--ink)}
  .item-prop{color:var(--sub);font-weight:400;font-size:11px;font-family:"SF Mono",ui-monospace,Consolas,monospace}
  .head-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .item-badge{font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--grey)}
  .item-badge.b-green{color:var(--green)}
  .item-badge.b-yellow{color:var(--yellow)}
  .item-badge.b-red{color:var(--red)}
  .item-badge.b-grey{color:var(--grey)}
  .item-badge.warn-badge{color:#b45309;font-weight:700}
  .chev{color:#94a3b8;transition:transform .2s,color .2s;font-size:13px;width:22px;height:22px;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .item.open .chev{transform:rotate(90deg);color:var(--accent)}

  /* version line: rendered as a monospace diff — 当前 → 目标 */
  .item-verhead{padding:8px 16px 14px 20px}
  .verline{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-family:"SF Mono",ui-monospace,Consolas,monospace}
  .vseg{display:inline-flex;align-items:baseline;gap:7px;font-size:13px}
  .vseg .vlabel{font-family:inherit;font-size:10.5px;font-weight:600;color:var(--sub);letter-spacing:.03em}
  .vseg .vnum{font-weight:600;font-size:14px}
  .vseg.cur .vnum{color:#334155}
  .vseg.tgt .vnum{color:var(--green)}
  .varr{color:#94a3b8;font-weight:700;font-size:13px;flex-shrink:0;padding:0 1px}
  .ver-meta{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ver-date{font-family:inherit;font-size:11px;color:var(--sub)}
  .gap{font-family:inherit;font-size:11px;font-weight:600;color:var(--yellow)}
  .stale{font-family:inherit;font-size:11px;font-weight:600;color:var(--grey)}
  .stale.fresh{color:var(--green)}
  .stale.mid{color:var(--yellow)}
  .stale.old{color:var(--red)}
  .vok{font-size:12px;font-weight:600;color:var(--green);font-family:inherit}
  .central-link{margin-left:auto;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--accent);
    text-decoration:none;border-bottom:1px dotted var(--accent-line);padding-bottom:1px}
  .central-link:hover{border-bottom-color:var(--accent)}
  .more-copy{font-family:inherit;font-size:11px;font-weight:600;color:var(--sub);background:none;
    border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;transition:.15s}
  .more-copy:hover{color:var(--accent);border-color:var(--accent-line)}

  /* body (expanded) */
  .item-body{display:none;padding:0 18px 18px 22px;font-size:13px;border-top:1px solid var(--line-soft);margin-top:4px}
  .item.open .item-body{display:block;padding-top:14px;animation:fade .18s ease}
  .field{margin:13px 0}
  .field .label{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:7px;letter-spacing:.04em}
  .risk,.warn{display:flex;gap:9px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:12.5px;margin:10px 0;line-height:1.65}
  .risk{background:var(--red-bg);color:#b91c1c;border:1px solid var(--red-line);font-weight:500}
  .warn{background:var(--yellow-bg);color:#92400e;border:1px solid var(--yellow-line);font-weight:500}
  .risk .ico,.warn .ico{font-size:14px;flex-shrink:0}

  /* upgrade options */
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 2px;
    border-bottom:1px solid var(--line-soft)}
  .opt:last-child{border-bottom:none}
  .opt .lv{font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;min-width:52px}
  .opt .lv.p{color:var(--green)}
  .opt .lv.m{color:var(--yellow)}
  .opt .lv.j{color:var(--red)}
  .opt .to{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:700;color:#394052}
  .opt .to b{color:var(--green)}
  .opt .note{flex:1;min-width:110px;font-size:12px;color:var(--sub)}
  .opt .reldate{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:11px;color:var(--sub);white-space:nowrap}

  .cl{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;
    font-size:12px;font-weight:700;white-space:nowrap}
  .cl:hover{text-decoration:underline}
  .cl.cmp{background:var(--blue-bg);padding:5px 11px;border-radius:9px;font-size:11.5px;border:1px solid var(--accent-line)}
  .cl.cmp:hover{text-decoration:none;filter:brightness(.98)}
  .changelog-links{display:flex;flex-direction:column;gap:7px}
  .cmp-list{display:flex;flex-direction:column;gap:7px;flex-wrap:wrap}
  .link-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* diagnostics (collapsed by default) */
  .diagnostics{margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}
  .diag-toggle{font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;background:none;border:none;
    padding:8px 0;display:inline-flex;align-items:center;gap:6px}
  .diag-toggle:hover{color:var(--accent)}
  .diag-toggle .darr{transition:transform .2s;font-size:10px}
  .diagnostics.open .diag-toggle .darr{transform:rotate(90deg)}
  .diag-body{display:none}
  .diagnostics.open .diag-body{display:block;animation:fade .18s ease}
  .diag-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;padding:8px 0 2px}
  .diag-item{font-size:12px;color:#3d4356;display:flex;gap:8px;align-items:baseline}
  .diag-item .dk{color:var(--sub);font-size:11px;white-space:nowrap;flex-shrink:0}
  .diag-item .dv{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:11.5px;word-break:break-all}
  .tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
  .tag{display:inline-block;background:var(--blue-bg);color:var(--accent);font-family:"SF Mono",ui-monospace,Consolas,monospace;
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px;border:1px solid var(--accent-line)}

  /* command blocks */
  .cmd{position:relative;background:linear-gradient(180deg,#232837,#1b2131);color:#d7dbe8;border-radius:11px;
    padding:13px 14px;margin:6px 0;font-family:"SF Mono",ui-monospace,Consolas,monospace;
    font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:pre;border:1px solid #2e3444}
  .cmd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 0 0 11px}
  .cmd .copy{position:absolute;top:9px;right:9px;background:rgba(255,255,255,.08);color:#c9cedf;
    border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600}
  .cmd .copy:hover{background:rgba(255,255,255,.16);color:#fff}
  .cmd .copy.done{background:var(--green);color:#fff;border-color:var(--green)}
  .cmd-label{font-size:11px;color:#9aa0b5;margin:11px 0 3px;font-weight:600}

  /* ---------- upgrade success modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
  .modal-overlay.show{display:flex;animation:modalIn .18s ease-out}
  @keyframes modalIn{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:18px;box-shadow:0 24px 60px -12px rgba(15,23,42,.45);
    width:min(440px,100%);padding:28px 28px 22px;text-align:center;animation:modalPop .2s ease-out}
  @keyframes modalPop{from{transform:scale(.94);opacity:.6}to{transform:scale(1);opacity:1}}
  .modal-icon{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;display:flex;
    align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#34d399,#16a34a);box-shadow:0 8px 20px -8px rgba(22,163,74,.6)}
  .modal h2{margin:0 0 6px;font-size:20px;color:#0f172a;font-weight:800}
  .modal-sub{margin:0 0 14px;font-size:13px;color:#64748b;line-height:1.6}
  .modal-sub code{background:#f1f5f9;border-radius:5px;padding:1px 6px;font-size:12px;color:#16a34a}
  .modal-summary{list-style:none;margin:0 0 18px;padding:12px 14px;text-align:left;
    background:linear-gradient(180deg,#f8fafc,#f1f5f9);border:1px solid #e2e8f0;border-radius:12px}
  .modal-summary li{font-size:14px;color:#334155;padding:5px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .modal-summary li b{color:#0f172a;font-weight:700;min-width:84px}
  .modal-summary .from{color:#94a3b8;text-decoration:line-through;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  .modal-summary .arrow{color:#16a34a;font-weight:700}
  .modal-summary .to{color:#16a34a;font-weight:700;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  .modal-actions{display:flex;gap:10px;justify-content:center}
  .modal-actions button{border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:800;cursor:pointer;transition:.15s}
  .modal-copy{background:#eef2ff;color:#4f6ef7}
  .modal-copy:hover{background:#e0e7ff}
  .modal-ok{background:linear-gradient(135deg,#6f8bff,var(--accent));color:#fff;box-shadow:0 6px 14px -6px rgba(79,110,247,.6)}
  .modal-ok:hover{filter:brightness(1.06);transform:translateY(-1px)}

  /* apply actions */
  .apply-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
  .apply-btn{border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:800;cursor:pointer;
    transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .apply-btn.apply{background:linear-gradient(135deg,#6f8bff,var(--accent));color:#fff;box-shadow:0 6px 14px -6px rgba(79,110,247,.6)}
  .apply-btn.apply:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .apply-btn:disabled{opacity:.5;cursor:default;transform:none;filter:none}
  .apply-status{font-size:12.5px}
  .apply-status.ok{color:var(--green);font-weight:700}
  .apply-status.err{color:var(--red);font-weight:600}
  .apply-note{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:9px;
    background:var(--yellow-bg);border:1px solid var(--yellow-line);border-radius:10px;padding:9px 13px}
  .apply-note b{color:#92400e}
  .apply-note code{background:#ffeecb;border-radius:5px;padding:1px 6px;font-size:10.5px}

  /* select-all bar (patch / minor / major panes) */
  .select-bar{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:12px;padding:11px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .select-all{border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer;
    color:#fff;background:linear-gradient(135deg,#6f8bff,var(--accent));box-shadow:0 5px 12px -6px rgba(79,110,247,.6);
    display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
  .select-all:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .select-hint{font-size:12px;color:var(--sub)}
  .select-bar .apply-status{font-size:12.5px}

  /* ---------- cross-tab cart (待升级清单) ---------- */
  .cart-toggle{position:fixed;right:20px;bottom:20px;z-index:60;border:none;border-radius:14px;
    padding:13px 20px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#6f8bff,var(--accent));box-shadow:0 10px 26px -8px rgba(79,110,247,.7);
    display:inline-flex;align-items:center;gap:9px;transition:.15s;white-space:nowrap}
  .cart-toggle:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .cart-toggle .cnt{background:rgba(255,255,255,.22);border-radius:20px;min-width:22px;height:22px;
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}
  .cart-toggle.hidden{display:none}
  .cart-panel{position:fixed;right:16px;bottom:76px;z-index:59;width:min(400px,calc(100vw - 32px));
    max-height:min(66vh,520px);display:flex;flex-direction:column;background:var(--card);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 60px -18px rgba(28,32,56,.4);
    overflow:hidden;transform-origin:bottom right;animation:cartIn .18s ease-out}
  @keyframes cartIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .cart-panel.hidden{display:none}
  .cart-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,#f8faff,#f1f4ff)}
  .cart-head h3{font-size:14px;font-weight:800;flex:1}
  .cart-head .clear{background:none;border:none;color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:8px}
  .cart-head .clear:hover{color:var(--red);background:var(--red-bg)}
  .cart-list{overflow-y:auto;padding:6px 10px}
  .cart-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;border-bottom:1px solid var(--line-soft)}
  .cart-item:last-child{border-bottom:none}
  .cart-item .ci-main{flex:1;min-width:0}
  .cart-item .ci-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cart-item .ci-prop{font-size:10.5px;color:var(--sub);font-family:"SF Mono",ui-monospace,Consolas,monospace;word-break:break-all}
  .cart-item .ci-ver{font-size:12px;font-family:"SF Mono",ui-monospace,Consolas,monospace;margin-top:2px}
  .cart-item .ci-ver .cur{color:var(--sub);text-decoration:line-through}
  .cart-item .ci-ver .arr{color:#94a3b8;font-weight:700}
  .cart-item .ci-ver .to{color:var(--green);font-weight:700}
  .cart-item .ci-ver .to.major{color:var(--red)}
  .cart-item .ci-src{font-size:10px;color:var(--sub);background:var(--grey-bg);border-radius:5px;padding:1px 6px;margin-left:4px}
  .cart-item .ci-rm{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:15px;line-height:1;
    width:26px;height:26px;border-radius:8px;flex-shrink:0}
  .cart-item .ci-rm:hover{color:var(--red);background:var(--red-bg)}
  .cart-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px}
  .cart-tag.p{color:var(--green);background:var(--green-bg)}
  .cart-tag.m{color:var(--yellow);background:var(--yellow-bg)}
  .cart-tag.j{color:var(--red);background:var(--red-bg)}
  .cart-foot{padding:12px 16px;border-top:1px solid var(--line-soft);background:#fbfcff}
  .cart-foot .apply-btn{width:100%;justify-content:center}
  .cart-migrate-note{font-size:11.5px;color:#92400e;background:var(--yellow-bg);border:1px solid var(--yellow-line);
    border-radius:9px;padding:8px 12px;margin-top:9px;line-height:1.6}
  .cart-empty{font-size:12.5px;color:var(--sub);text-align:center;padding:26px 12px}
  .pick{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}

  /* table (top5) */
  .table-scroll{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);background:#fff}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 14px;font-size:13px;border-bottom:1px solid var(--line-soft)}
  th{background:#f7f8fc;color:var(--sub);font-weight:700;font-size:11.5px;white-space:nowrap;letter-spacing:.03em}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafbff}
  td.ver{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:12px;white-space:nowrap;font-weight:600}
  td .note{font-size:11px;color:var(--sub)}
  .rank{display:inline-flex;width:22px;height:22px;border-radius:7px;background:var(--grey-bg);color:var(--sub);
    align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .rank.r1{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#7c4a03}
  .rank.r2{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#374151}
  .rank.r3{background:linear-gradient(135deg,#f4c8b8,#d97706);color:#7c2d12}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%}
  .dot.green{background:var(--green)} .dot.yellow{background:var(--yellow)}
  .dot.red{background:var(--red)} .dot.grey{background:var(--grey)} .dot.blue{background:var(--blue)}

  .note{font-size:12px;color:var(--sub);margin-top:4px}
  footer{text-align:center;color:var(--sub);font-size:11.5px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line)}

  @media(max-width:720px){
    header{flex-direction:column;align-items:flex-start}
    .meta{text-align:left}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat .v{font-size:24px}
    .item-head{flex-wrap:wrap}
    .diag-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm7 4.5A2.5 2.5 0 0 0 9.5 10h3a2.5 2.5 0 0 1 0 5h-2.6a2 2 0 0 0 1.9 1.5H14a3 3 0 0 0 0-6h-2.5a1.5 1.5 0 0 1 0-3H13a2 2 0 0 0 1.9 1.5H15A2.5 2.5 0 0 0 12.5 7.5H12z"/></svg>
      </div>
      <div>
        <h1>ContiNew Starter 依赖升级分析</h1>

      </div>
    </div>

<script>
const DATA = __REPORT_DATA__;
const APPLY = __APPLY_CONFIG__; // null=静态只读；{token,endpoint}=server.py 提供一键应用

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- date helpers ---------------------------------------------------------
function fmtDate(rfc){
  if(!rfc) return '';
  const d = new Date(rfc);
  if(isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function staleness(rfc){
  if(!rfc) return null;
  const d = new Date(rfc);
  if(isNaN(d)) return null;
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if(days < 0) return {days, label:'即将发布/未来', cls:'fresh'};
  if(days < 90)  return {days, label:`已发布 ${days} 天`, cls:'fresh'};
  if(days < 365) return {days, label:`已发布约 ${Math.floor(days/30)} 个月`, cls:'mid'};
  const years = Math.floor(days / 365);
  const months = Math.floor((days % 365) / 30);
  const ym = years > 0 ? `${years} 年` + (months > 0 ? ` ${months} 个月` : '') : `约 ${Math.floor(days/30)} 个月`;
  return {days, label:`已发布约 ${ym}`, cls: years >= 2 ? 'old' : 'mid'};
}
function relTime(rfc){
  if(!rfc) return '';
  const d = new Date(rfc);
  if(isNaN(d)) return '';
  const days = Math.round((Date.now() - d.getTime()) / 86400000);
  if(days < 0)  return '即将发布';
  if(days === 0) return '今天';
  if(days === 1) return '昨天';
  if(days < 30)  return `${days}天前`;
  if(days < 365) return `约${Math.round(days/30)}个月前`;
  const years = Math.floor(days / 365);
  const months = Math.round((days % 365) / 30);
  return months > 0 ? `约${years}年${months}个月前` : `约${years}年前`;
}
// "2026-03-08（约5个月前）" — absolute date + relative time, shown in one label.
function dateRel(rfc){
  const abs = fmtDate(rfc);
  if(!abs) return '未获取到';
  const rel = relTime(rfc);
  return rel ? `${abs}（${rel}）` : abs;
}

// ---- shared snippets ------------------------------------------------------
function copyBtn(text){
  return `<button class="copy" data-cmd="${btoa(unescape(encodeURIComponent(text)))}">复制</button>`;
}
function cmdBlock(c){
  const label = c.label ? `<div class="cmd-label">${esc(c.label)}</div>` : '';
  return `${label}<div class="cmd">${copyBtn(c.cmd)}${esc(c.cmd)}</div>`;
}

// ---- overview / top5 / priority ------------------------------------------
function renderOverview(){
  const s = DATA.summary;
  document.getElementById('meta').innerHTML =
    `<div>生成于 <b>${esc(DATA.generated_at||'')}</b></div>
     <div>扫描耗时 ${esc(DATA.scan_seconds||'?')}s · revision <b>${esc(DATA.revision||'')}</b></div>`;
  const total = s.total || 1;
  const g=s.green, y=s.yellow, r=s.red, dg=s.downgrade||0, up=s.up_to_date, un=s.unreachable;
  const seg=(v,cls,label)=> v>0?`<i class="${cls}" style="width:${(v/total*100).toFixed(2)}%" title="${label}：${v}"></i>`:'';
  const bar = seg(g,'seg-green','🟢补丁')+seg(y,'seg-yellow','🟡小版本')+seg(r,'seg-red','🔴大版本')
    +seg(dg,'seg-grey','⚪异常')+seg(up,'seg-blue','已最新')+seg(un,'seg-grey','未检测');
  const pills = `<div class="pills">
    <span class="pill g">🟢 补丁 <b>${g}</b></span>
    <span class="pill y">🟡 小版本 <b>${y}</b></span>
    <span class="pill r">🔴 大版本 <b>${r}</b></span>
    ${dg?`<span class="pill">⚪ 异常 <b>${dg}</b></span>`:''}
    <span class="pill b">已最新 <b>${up}</b></span>
  </div>`;
  const offlineWarn = DATA.offline
    ? `<div class="offline-warn">⚠️ 离线模式：部分坐标元数据抓取失败，版本数据可能过期，请联网重跑 scan.py。</div>` : '';
  return `<div class="overview">
    <p class="lead">共 <b>${s.total}</b> 个依赖坐标，其中 <b style="color:var(--red)">${s.outdated}</b> 个落后于最新版本
      <b style="color:var(--yellow)">${s.red}</b> 个跨大版本需人工迁移，其余均位于最新可用版本。</p>
    <div class="stats">
      <div class="stat total"><div class="k">依赖总数</div><div class="v">${s.total}</div></div>
      <div class="stat out"><div class="k">落后待升级</div><div class="v">${s.outdated}</div></div>
      <div class="stat ok"><div class="k">已是最新</div><div class="v">${s.up_to_date}</div></div>
      <div class="stat major"><div class="k">跨大版本</div><div class="v">${s.red}</div></div>
    </div>
    <div class="bar">${bar}</div>
    ${pills}
    ${offlineWarn}
    <div class="sysgrid">
      <div><span>数据源</span><br>Maven Central (repo1.maven.org)</div>
      <div><span>检测方式</span><br>maven-metadata.xml</div>
      <div><span>release 计算</span><br>max(GA versions)</div>
      <div><span>分级</span><br>补丁 / 小版本 / 大版本</div>
    </div>
  </div>`;
}

function renderTop5(){
  if(!DATA.top5||!DATA.top5.length) return '';
  const body = DATA.top5.map(r=>`<tr>
    <td><span class="rank ${r.rank===1?'r1':r.rank===2?'r2':r.rank===3?'r3':''}">${esc(r.rank)}</span></td>
    <td><span class="dot ${esc(r.tier==='downgrade'?'grey':r.tier)}"></span></td>
    <td><b>${esc(r.artifact)}</b><br><span class="note">${esc(r.property)}</span></td>
    <td class="ver">${esc(r.locked)}</td>
    <td class="ver" style="color:${r.tier==='red'?'var(--red)':r.tier==='yellow'?'var(--yellow)':'var(--green)'}">${esc(r.target||'-')}</td>
    <td>${esc(r.type)}</td>
    <td>${esc(r.note||'')}</td>
  </tr>`).join('');
  return `<div class="sec"><div class="sec-head"><h2>落后排行 Top 5</h2></div>
    <div class="table-scroll"><table><thead><tr><th>#</th><th>级</th><th>构件</th><th>当前</th><th>目标</th><th>类别</th><th>约束</th></tr></thead>
    <tbody>${body}</tbody></table></div></div>`;
}

function renderPriority(){
  const a = DATA.analysis;
  if(!a || (!a.priority && !a.overview)) return '';
  const intro = a.overview?`<p class="lead" style="margin-bottom:0">${esc(a.overview)}</p>`:'';
  const body = a.priority?`<ul>${a.priority.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  return `<div class="sec"><div class="sec-head"><h2>执行建议</h2></div><div class="summary">${intro}${body}</div></div>`;
}

// ---- apply block ----------------------------------------------------------
function applyBlock(it, target, allowApply){
  if(!APPLY || !target || !allowApply) return '';
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify({property:it.property, target:target}))));
  return `<div class="field apply-actions" data-apply="${payload}">
    <div class="label">一键应用（当前分支）</div>
    <div class="apply-row">
      <button class="apply-btn apply" onclick="doApply(this)">⚡ 应用升级</button>
      <span class="apply-status"></span>
    </div>
    <div class="apply-note"><b>⚠️ 直接在当前分支操作</b>：只改 POM property，<b>不跑 mvn、不提交、不推送</b>。
      改完请自行执行 <code>mvn compile</code> 验证；回退直接 git checkout 该 POM。</div>
  </div>`;
}

// ---- upgrade option rows (patch / minor / major) --------------------------
// Scoped to the current tab: inside a 补丁 tab only the patch target shows, so a
// red-tier dep like Spring Boot is presented as a safe patch, not "跨大版本".
function optionRows(it, tab){
  const tg = it.targets || {}, cl = it.changelogs || {};
  const defs = [
    ['patch','p','补丁','同 minor 线内，安全补丁'],
    ['minor','m','小版本','跨 minor，需读变更'],
    ['major','j','大版本','跨 major，需迁移'],
  ];
  const isUpgradeTab = tab==='patch' || tab==='minor' || tab==='major';
  const keys = isUpgradeTab ? [tab] : defs.map(d=>d[0]);
  const rows = keys.filter(k=>tg[k]).map(k=>{
    const [,c,label,hint] = defs.find(d=>d[0]===k);
    const link = cl[k] ? `<a class="cl" href="${esc(cl[k])}" target="_blank" rel="noopener">变更记录 ↗</a>` : '';
    const cu = (it.compare_urls && it.compare_urls[k])
      ? `<a class="cl cmp" href="${esc(it.compare_urls[k])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📊 完整变更</a>` : '';
    const rd = (it.released&&it.released[k]) ? dateRel(it.released[k]) : '';
    const rdHtml = rd ? `<span class="reldate">${esc(rd)}</span>` : '';
    return `<div class="opt"><span class="lv ${c}">${label}</span>
      <span class="to">${esc(it.locked)} → <b>${esc(tg[k])}</b></span>
      <span class="note">${esc(hint)}</span>${cu}${link}${rdHtml}</div>`;
  });
  if(!rows.length) return '';
  const label = isUpgradeTab ? (tab==='patch'?'可选补丁目标':tab==='minor'?'可选小版本目标':'可选大版本目标') : '可选升级目标';
  return `<div class="field"><div class="label">${label}</div>
    <div class="opts">${rows.join('')}</div></div>`;
}

// ---- card ----------------------------------------------------------------
function card(it, tier, t){
  // tier 是当前 tab 决定的左侧色条色（green/yellow/red/grey）；
  // it.tier 是该项全局判定（可能同时有 patch+minor+major，全局取最高风险）。
  // 关键：在一个升级 tab 里，卡片语义必须跟随【当前 tab 的档位】，
  // 而不能用全局 it.tier——否则补丁 tab 里的 Spring Boot 会被误标成"跨大版本"。
  const barCls = tier || it.tier || 'grey';
  const isUpgradeTab = t==='patch' || t==='minor' || t==='major';
  const curTier = isUpgradeTab ? t : it.tier;      // 当前语境下的风险档位
  const LEVEL = {
    patch:{t:'可直接升', c:'b-green'}, minor:{t:'读要点后升', c:'b-yellow'}, major:{t:'需迁移', c:'b-red'},
    green:{t:'可直接升', c:'b-green'}, yellow:{t:'读要点后升', c:'b-yellow'}, red:{t:'需迁移', c:'b-red'},
    downgrade:{t:'版本异常', c:'b-grey'}, uptodate:{t:'已最新', c:'b-grey'}, plugin:{t:'构建插件', c:'b-grey'}
  };
  const badge = LEVEL[curTier] || {t:'', c:'b-grey'};
  const typeLabel = t==='patch'?'补丁':t==='minor'?'小版本':t==='major'?'大版本':'';
  const target = isUpgradeTab ? (it.targets && it.targets[t]) : (it.target || it.release || '');
  const curDate = dateRel(it.locked_released);
  const tgtDate = (t && it.released && it.released[t]) ? dateRel(it.released[t]) : '';
  const gapN = (t && it.gap_versions_by_tier && it.gap_versions_by_tier[t])
    ? it.gap_versions_by_tier[t].length
    : (it.gap_versions ? it.gap_versions.length : 0);
  const st = staleness(it.locked_released);
  const staleBadge = st ? `<span class="stale ${st.cls}">${esc(st.label)}</span>` : '';

  // Central link (moved up from the expanded body into the version line).
  const centralHref = `https://central.sonatype.com/artifact/${esc(it.group_id||'').replace(/&/g,'')}/${esc(it.name||'').replace(/&/g,'')}/overview`;
  const centralLink = `<a class="central-link" href="${centralHref}" target="_blank" rel="noopener" onclick="event.stopPropagation()">中央仓库 ↗</a>`;

  // Version line: a monospace diff — [当前] → [目标], central link on the right.
  let verline;
  if(t){
    verline = `<div class="verline">
      <span class="vseg cur"><span class="vlabel">当前</span><span class="vnum">${esc(it.locked)}</span>
        <span class="ver-date">${esc(curDate)}</span>${staleBadge}</span>
      <span class="varr">→</span>
      <span class="vseg tgt"><span class="vlabel">${esc(typeLabel)}</span><span class="vnum">${esc(target||'-')}</span>
        <span class="ver-date">${esc(tgtDate||'未获取到')}</span>
        ${gapN?`<span class="gap">落后 ${gapN} 版</span>`:''}</span>
      ${centralLink}
    </div>`;
  } else {
    verline = `<div class="verline">
      <span class="vseg cur"><span class="vlabel">当前</span><span class="vnum">${esc(it.locked)}</span>
        <span class="ver-date">${esc(curDate)}</span>${staleBadge}</span>
      ${it.tier==='uptodate'?`<span class="vok">已是最新可用版本</span>`:''}
      ${centralLink}
    </div>`;
  }

  // Expanded body — clean, deduplicated sections.
  let body = '';
  if(it.cloud_compat_warn){
    body += `<div class="warn"><span class="ico">⚠️</span><span>${esc(it.cloud_compat_warn)}</span></div>`;
  }
  if(curTier==='major'){
    body += `<div class="risk"><span class="ico">⚠️</span><span>跨大版本，几乎必有破坏性变更（API 移除 / 配置改名 / 行为变更）。compile 通过不代表运行时行为没变，务必读迁移要点并全 reactor 验证，本项不提供「应用升级」按钮。</span></div>`;
  }
  if(it.tier==='downgrade'){
    body += `<div class="warn"><span class="ico">⚪</span><span>当前版本比 Central release 新，疑似项目重新编号或坐标指向不同分支。请人工核验是否需要更换 artifact，本项不当作升级、不给按钮。</span></div>`;
  }
  if(it.tier==='uptodate' && st && st.cls==='old'){
    body += `<div class="warn"><span class="ico">⚪</span><span>该依赖已位于最新可用版本，但当前版本${esc(st.label)}未变动。若上游长期无新发布，可评估是否替换为更活跃的组件。</span></div>`;
  }
  if(it.constraints) body += `<div class="field"><div class="label">升级约束</div>${esc(it.constraints)}</div>`;
  body += optionRows(it, t);

  // Code-change / release-note links only. The "central repo" link lives on the
  // version line above; the "all versions" list link was removed as noise.
  const links = [];
  // Scope code-change links to the current tab: in a 补丁 tab only the patch
  // compare link shows, so a red dep doesn't leak its major "代码变更" here.
  const linkKeys = isUpgradeTab
    ? Object.keys(it.compare_urls||{}).filter(k=>k===t)
    : Object.keys(it.compare_urls||{});
  linkKeys.forEach(k=>{
    const from = it.locked, to = it.targets[k];
    links.push(`<a class="cl cmp" href="${esc(it.compare_urls[k])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📊 ${esc(k==='patch'?'补丁':k==='minor'?'小版本':k==='major'?'大版本':k)}：${esc(from)}→${esc(to)} 代码变更</a>`);
  });
  if(it.changelog && !(it.targets&&(it.targets.patch||it.targets.minor||it.targets.major))){
    links.push(`<a class="cl" href="${esc(it.changelog)}" target="_blank" rel="noopener">📰 上游发布说明 ↗</a>`);
  }
  if(links.length){
    body += `<div class="field"><div class="label">代码变更记录</div><div class="changelog-links">${links.join('')}</div></div>`;
  }

  // Diagnostics — technical noise collapsed by default.
  const diag = [];
  if(it.family) diag.push(`<div class="diag-item"><span class="dk">类别</span><span class="dv">${esc(it.family)}</span></div>`);
  if(it.release) diag.push(`<div class="diag-item"><span class="dk">Central release</span><span class="dv">${esc(it.release)}</span></div>`);
  if(it.same_line_latest) diag.push(`<div class="diag-item"><span class="dk">同主线最新</span><span class="dv">${esc(it.same_line_latest)}</span></div>`);
  if(it.gap_versions && it.gap_versions.length){
    const show = it.gap_versions.slice(0,20);
    diag.push(`<div class="diag-item" style="flex-basis:100%"><span class="dk">缺口版本（${it.gap_versions.length}）</span>
      <span class="tags" style="display:inline-flex">${show.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</span></div>`);
  }
  if(diag.length){
    body += `<div class="field diagnostics">
      <button class="diag-toggle" type="button" onclick="event.stopPropagation();this.closest('.diagnostics').classList.toggle('open')">
        <span class="darr">▶</span> 更多技术细节
      </button>
      <div class="diag-body"><div class="diag-grid">${diag.join('')}</div></div>
    </div>`;
  }

  if(it.commands && it.commands.length){
    body += `<div class="field"><div class="label">POM 修改命令（自行确认后执行）</div>${it.commands.map(cmdBlock).join('')}</div>`;
  }
  body += applyBlock(it, target, curTier!=='major');

  const coord = esc(it.group_id||'')+':'+esc(it.name);
  // Cross-tab cart: a pick checkbox on every upgrade card. t is the current tab
  // tier ('' for ok/other), curTier is the risk level in this context.
  let pickHtml = '';
  if(APPLY && (curTier==='patch' || curTier==='minor' || curTier==='major')){
    const pv = isUpgradeTab ? target : (it.target || '');
    const source = t || curTier;
    const displayTier = curTier==='patch'?'p':curTier==='minor'?'m':'j';
    pickHtml = `<input class="pick" type="checkbox" title="加入待升级清单（${badge.t}）"
      data-prop="${esc(it.property)}" data-target="${esc(pv||'')}" data-name="${esc(it.name)}"
      data-old="${esc(it.locked)}" data-tier="${displayTier}" data-source="${esc(source)}" onclick="onPick(this);event.stopPropagation()">`;
  }
  return `<div class="item ${barCls}" data-prop="${esc(it.property)}">
    <div class="item-head">
      ${pickHtml}
      <div class="item-id">
        <div class="name-line">
          <span class="item-name">${esc(it.name)}</span>
          <span class="cart-state"></span>
        </div>
        <small class="item-prop">${esc(it.property)}</small>
      </div>
      <div class="head-right">
        ${it.cloud_compat_warn?`<span class="item-badge warn-badge">⚠ Boot 不匹配</span>`:''}
        <span class="item-badge ${badge.c}">${badge.t}</span>
        <button class="more-copy" type="button" title="复制坐标 ${coord}" data-copy="${coord}" onclick="copyCoord(this);event.stopPropagation()">⧉ 坐标</button>
        <span class="chev">▶</span>
      </div>
    </div>
    <div class="item-verhead">${verline}</div>
    <div class="item-body">${body}</div></div>`;
}

// ---- apply handler (server mode only) -------------------------------------
function doApply(btn){
  const wrap = btn.closest('.apply-actions');
  const payload = JSON.parse(decodeURIComponent(escape(atob(wrap.dataset.apply))));
  if(!confirm(`⚠️ 将在【当前 git 分支】直接把 ${payload.property} 从当前值改为 ${payload.target}。\n只改 POM，不跑 mvn、不提交、不推送；改完请自行 mvn compile 验证。\n确认继续？`)) return;
  const status = wrap.querySelector('.apply-status');
  const applyBtns = wrap.querySelectorAll('.apply-btn');
  status.textContent='应用中…'; status.className='apply-status';
  applyBtns.forEach(b=>b.disabled=true);
  fetch(APPLY.endpoint, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:APPLY.token, property:payload.property, target:payload.target})})
    .then(r=>r.json()).then(res=>{
      applyBtns.forEach(b=>b.disabled=false);
      if(res.ok){
        status.textContent='✓ 已改 POM（当前分支，未提交、未编译）。请自行 mvn compile 验证后决定 commit 或 git checkout 回退。';
        status.className='apply-status ok';
        const item=wrap.closest('.item'); if(item){ item.classList.add('applied'); }
        applyBtns.forEach(b=>b.remove());
        // sync cross-tab cart: this property is now applied, drop it from the list
        cart.delete(res.prop);
        appliedProps.add(res.prop);
        syncPickState();
        renderCart();
        showUpgradeSuccess([{name:res.name, property:res.prop, from:res.old, to:res.target}]);
      } else {
        status.textContent='✗ '+(res.error||'失败'); status.className='apply-status err';
        if(res.rolled_back) status.textContent += '（POM 已回滚到原值）';
      }
    }).catch(e=>{ applyBtns.forEach(b=>b.disabled=false);
      status.textContent='✗ 连接失败：'+e; status.className='apply-status err'; });
}

// ---- success summary modal ------------------------------------------------
// rows: [{name, property, from, to}]  e.g. {name:'spring-boot', from:'3.4.10', to:'3.5.13'}
function showUpgradeSuccess(rows){
  if(!rows || !rows.length) return;
  const body = rows.map(r=>{
    const label = r.name || r.property;
    return `<li><b>${esc(label)}</b> <span class="from">${esc(r.from||'')}</span> <span class="arrow">⇒</span> <span class="to">${esc(r.to||'')}</span></li>`;
  }).join('');
  const copyText = rows.map(r=>`${r.name||r.property} ${r.from||''} => ${r.to||''}`).join('\n');
  const overlay = document.getElementById('upgrade-modal');
  overlay.querySelector('.modal-summary').innerHTML = body;
  const copyBtn = overlay.querySelector('.modal-copy');
  copyBtn.onclick = () => {
    navigator.clipboard?.writeText(copyText).then(()=>{
      copyBtn.textContent='✓ 已复制';
      setTimeout(()=>copyBtn.textContent='复制全部', 1500);
    }).catch(()=>{});
  };
  overlay.classList.add('show');
}
function closeUpgradeModal(){
  document.getElementById('upgrade-modal').classList.remove('show');
}

// ---- cross-tab cart (待升级清单) --------------------------------------------
// A property is the UNIQUE cart key. The same dependency shows up in several
// upgrade tabs (e.g. Spring Boot in patch AND major); the cart keeps ONE row per
// property. Re-picking the same property from another tab asks whether to
// overwrite its target. Major entries are kept for visibility but are NEVER
// auto-applied (mirrors the "no apply button on major" rule).
const cart = new Map(); // property -> {property,name,target,old,tier,source}

function tierInfo(tier, name){
  return {
    label: tier==='p'?'补丁':tier==='m'?'小版本':'大版本',
    cls:   tier==='p'?'p':tier==='m'?'m':'j',
    major: tier==='j',
  };
}
// source string (data-source on a pick) → Chinese tab label
const TIER_LABEL_MAP = {patch:'补丁', minor:'小版本', major:'大版本', p:'补丁', m:'小版本', j:'大版本'};
function tierLabel(src){ return TIER_LABEL_MAP[src] || src || ''; }

const appliedProps = new Set(); // properties already written to the POM (no longer editable)

// Reconcile every pick box + left-side status label after a cart change.
// A dependency is UNIQUE across tabs: once you pick its target in one tab, that
// same property's box in EVERY OTHER tab is disabled with a hint (e.g. picked
// spring-boot in 补丁 → its 小版本/大版本 boxes are locked out). The source box
// stays checked & removable.
function syncPickState(){
  document.querySelectorAll('.pick').forEach(cb=>{
    const prop = cb.dataset.prop;
    const inCart = prop && cart.has(prop);
    const applied = prop && appliedProps.has(prop);
    if(inCart){
      const cur = cart.get(prop);
      const isSource = cb === cur.srcBox;
      if(isSource){
        cb.disabled = false; cb.checked = true; // the box the user actually picked stays removable
        cb.title = `已加入待升级清单（${tierInfo(cur.tier).label} → ${cur.target}），取消勾选可移出`;
      } else {
        cb.disabled = true; cb.checked = false; // same dep in another tab: lock it out
        cb.title = `该依赖已在「${tierLabel(cur.source)}」档选择 ${cur.target}，本档不可再选；如需改选请先在待升级清单移除`;
      }
    } else if(applied){
      cb.disabled = true; cb.checked = false;
      cb.title = '该依赖已应用升级，无需再选';
    } else {
      cb.disabled = false; cb.checked = false;
      cb.title = '加入待升级清单（跨 tab 勾选后统一升级）';
    }
  });
  // per-card markers + a left-side status label next to the pick box (right where
  // the eye naturally scans), instead of only the right-edge badge.
  document.querySelectorAll('.item[data-prop]').forEach(it=>{
    const p = it.dataset.prop;
    const st = it.querySelector('.cart-state');
    it.classList.toggle('in-cart', !!p && cart.has(p));
    if(st){
      if(p && cart.has(p)){
        const cur = cart.get(p);
        st.textContent = `✓ 已在清单 · ${tierInfo(cur.tier).label} ${cur.target}`;
        st.className = 'cart-state on';
      } else if(p && appliedProps.has(p)){
        st.textContent = '✓ 已升级';
        st.className = 'cart-state applied';
      } else {
        st.textContent = '';
        st.className = 'cart-state';
      }
    }
  });
}

function onPick(cb){
  const prop = cb.dataset.prop, target = cb.dataset.target, name = cb.dataset.name;
  const old = cb.dataset.old, tier = cb.dataset.tier, source = cb.dataset.source;
  if(!target){ cb.checked = false; return; }
  if(cb.checked){
    // same property is already in the cart (its other-tab boxes are disabled, but
    // guard anyway): reject — the only way to change it is to remove it first.
    if(cart.has(prop)){ cb.checked = false; return; }
    // srcBox remembers WHICH card's box added this property, so that card stays
    // checked while the same property's boxes in other tabs get locked out.
    cart.set(prop, {property:prop, name, target, old, tier, source, srcBox: cb});
  } else {
    cart.delete(prop);
  }
  syncPickState();
  renderCart();
}

// Select every eligible pick box in the current tab into the cart at once.
// Eligible = not disabled (already in cart / locked out by another tab / applied)
// and not already checked. Skipped ones are reported back on the bar.
function selectAllTab(t, btn){
  const pane = document.getElementById('pane-'+t);
  const status = btn.closest('.select-bar').querySelector('.apply-status');
  const picks = pane.querySelectorAll('.pick');
  const skipped = [];
  let added = 0;
  picks.forEach(cb=>{
    if(cb.disabled){ if(cb.checked){} else skipped.push(cb.dataset.name || cb.dataset.prop); return; }
    if(cb.checked) return;
    cb.checked = true;
    onPick(cb);
    added++;
  });
  // dedupe skipped names
  const uniq = [...new Set(skipped)];
  if(added){
    status.textContent = `✓ 已加入 ${added} 项到待升级清单`;
    status.className = 'apply-status ok';
    toggleCart(true); // open the cart so the user sees the result
  } else if(uniq.length){
    status.textContent = `本档 ${uniq.length} 项已不可选（已在清单或已升级）：${uniq.slice(0,3).join('、')}${uniq.length>3?'…':''}`;
    status.className = 'apply-status err';
  } else {
    status.textContent = '本档没有可加入清单的项';
    status.className = 'apply-status err';
  }
}

function renderCart(){
  const items = [...cart.values()];
  const toggle = document.getElementById('cart-toggle');
  toggle.classList.toggle('hidden', items.length === 0);
  document.getElementById('cart-cnt').textContent = items.length;
  document.getElementById('cart-sum').textContent = items.length ? `（${items.length} 项）` : '';

  const list = document.getElementById('cart-list');
  const foot = document.getElementById('cart-foot');
  if(!items.length){
    list.innerHTML = `<div class="cart-empty">还没有选择依赖，去各 tab 勾选想升级的项吧</div>`;
    foot.innerHTML = '';
    return;
  }
  list.innerHTML = items.map(it=>{
    const t = tierInfo(it.tier);
    return `<div class="cart-item" data-prop="${esc(it.property)}">
      <div class="ci-main">
        <div class="ci-name">${esc(it.name)}
          <span class="cart-tag ${t.cls}">${t.label}</span>
          <span class="ci-src">来自「${esc(tierLabel(it.source))}」</span></div>
        <div class="ci-prop">${esc(it.property)}</div>
        <div class="ci-ver"><span class="cur">${esc(it.old||'')}</span> <span class="arr">⇒</span>
          <span class="to ${t.major?'major':''}">${esc(it.target)}</span></div>
      </div>
      <button class="ci-rm" type="button" title="移除" onclick="removeFromCart('${esc(it.property)}',this)">✕</button>
    </div>`;
  }).join('');

  const auto = items.filter(i=>!tierInfo(i.tier).major);
  const majors = items.filter(i=>tierInfo(i.tier).major);
  foot.innerHTML = auto.length
    ? `<button class="apply-btn apply" onclick="doCartApply(this)">⚡ 统一升级${auto.length} 项</button>
       <span class="apply-status" style="display:inline-block;margin-top:8px"></span>`
    : '';
  if(majors.length){
    foot.innerHTML += `<div class="cart-migrate-note">⚠️ ${majors.length} 项为 <b>大版本（需迁移）</b>，按安全规则<u>不自动应用</u>，
      仅用于跨 tab 统一浏览。请逐个读迁移要点、复制命令后自行处理。</div>`;
  }
}

function removeFromCart(prop, btn){
  cart.delete(prop);
  syncPickState();
  renderCart();
}
function clearCart(){
  if(!cart.size) return;
  if(!confirm(`清空待升级清单（${cart.size} 项）？`)) return;
  cart.clear();
  syncPickState();
  renderCart();
}
function toggleCart(show){
  const p = document.getElementById('cart-panel');
  const isShow = show === undefined ? p.classList.contains('hidden') : show;
  p.classList.toggle('hidden', !isShow);
}

function doCartApply(btn){
  if(!APPLY) return;
  const items = [...cart.values()].filter(i=>!tierInfo(i.tier).major); // majors never auto-applied
  if(!items.length) return;
  const pairs = items.map(i=>({property:i.property, target:i.target}));
  const list = items.map(i=>`  · ${i.name}(${i.property}) ${i.old||''} ⇒ ${i.target}`).join('\n');
  if(!confirm(`⚠️ 将在【当前 git 分支】一次性把待升级清单中的 ${items.length} 项写入 POM：\n\n${list}\n\n只改 POM，不跑 mvn、不提交、不推送；改完请自行 mvn compile 验证。\n确认继续？`)) return;
  const statusEl = btn.closest('.cart-foot').querySelector('.apply-status');
  btn.disabled = true; statusEl.textContent='统一升级中…'; statusEl.className='apply-status';
  fetch(APPLY.endpoint, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:APPLY.token, items:pairs})})
    .then(r=>r.json()).then(res=>{
      btn.disabled = false;
      if(!res.ok && !res.applied){
        statusEl.textContent='✗ '+(res.error||'失败'); statusEl.className='apply-status err'; return;
      }
      const failed = (res.results||[]).filter(r=>!r.ok);
      if(failed.length){
        statusEl.className='apply-status err';
        statusEl.textContent=`⚠️ 成功 ${res.applied} 项，失败 ${failed.length} 项：`
          + failed.map(f=>`${f.property}(${f.error})`).join('；');
      } else {
        statusEl.className='apply-status ok';
        statusEl.textContent=`✓ 已写入 ${res.applied} 项（当前分支，未提交、未编译）。`;
        showUpgradeSuccess((res.results||[]).filter(r=>r.ok)
          .map(r=>({name:r.name, property:r.property, from:r.old, to:r.target})));
      }
      // mark cards + checkboxes across ALL tabs as applied/removed for succeeded props
      const okProps = new Set((res.results||[]).filter(r=>r.ok).map(r=>r.property));
      okProps.forEach(p=>{
        cart.delete(p);
        appliedProps.add(p);
        document.querySelectorAll(`.item[data-prop="${CSS.escape(p)}"]`).forEach(it=>it.classList.add('applied'));
      });
      syncPickState();
      renderCart();
      const majorLeft = [...cart.values()].filter(i=>tierInfo(i.tier).major).length;
      if(!cart.size){
        document.getElementById('cart-toggle').classList.add('hidden');
        if(majorLeft){ toggleCart(true); }
      }
    }).catch(e=>{ btn.disabled=false;
      statusEl.textContent='✗ 连接失败：'+e; statusEl.className='apply-status err'; });
}

// ---- mount ----------------------------------------------------------------
const a = DATA.analysis || {};
const has = (it,k)=> !!(it.targets && it.targets[k]);
const all = [].concat(a.green||[], a.yellow||[], a.red||[], a.downgrade||[]);
const byType = {
  patch: all.filter(it=>has(it,'patch')),
  minor: all.filter(it=>has(it,'minor')),
  major: all.filter(it=>has(it,'major')),
};
const others  = (a.downgrade||[]).concat(a.unreachable_items||[]);
const uptodate = a.uptodate || [];

const ts = rfc => { const t = Date.parse(rfc); return isNaN(t) ? Infinity : t; };
const gapOf = it => (it.gap_versions ? it.gap_versions.length : 0);
const byBehind = (x,y) => (gapOf(y)-gapOf(x)) || (ts(x.locked_released)-ts(y.locked_released));
const byOldest = (x,y) => ts(x.locked_released) - ts(y.locked_released);
byType.patch.sort(byBehind);
byType.minor.sort(byBehind);
byType.major.sort(byBehind);
uptodate.sort(byOldest);

function pane(id, html){ return `<div class="pane" id="pane-${id}">${html}</div>`; }
function listOf(items, tier, hint, t){
  if(!items.length) return `<div class="empty"><div class="big">🎉</div>这一档目前没有需要处理的依赖</div>`;
  const selBar = APPLY ? `<div class="select-bar">
      <button class="select-all" type="button" onclick="selectAllTab('${t}',this)">☑ 全选本档加入清单</button>
      <span class="select-hint">把本档所有可升级项加入右下角「待升级清单」，再统一升级</span>
      <span class="apply-status"></span>
    </div>` : '';
  return (hint?`<div class="pane-hint">${hint}</div>`:'')
    + selBar
    + items.map(it=>card(it,tier,t)).join('');
}

const tabsDef = [
  ['patch', '补丁', byType.patch.length],
  ['minor', '小版本', byType.minor.length],
  ['major', '大版本', byType.major.length],
  ['ok',    '已最新', uptodate.length],
  ['other', '其他', others.length],
];
const tabBar = `<div class="tabs">${tabsDef.map(([k,label,n])=>
  `<button class="tab" data-t="${k}" onclick="switchTab('${k}')">${label}<b>${n}</b></button>`).join('')}</div>`;

const cartHint = APPLY ? ' 可勾选本档项加入右下角「待升级清单」，跨 tab 自由组合后统一升级；同一依赖多个 tab 均出现时，清单只保留一个目标版本。' : '';
const panes =
   pane('patch', listOf(byType.patch,'green','同 minor 线内的补丁升级，通常只含缺陷修复与安全补丁，风险最低，可逐项核对后直接应用。' + cartHint,'patch'))
 + pane('minor', listOf(byType.minor,'yellow','同 major 跨 minor，可能引入新特性与弃用项，升级前务必读上游变更记录。' + cartHint,'minor'))
 + pane('major', listOf(byType.major,'red','跨 major，几乎必有破坏性变更，建议单独开分支立项逐个迁移并全 reactor 验证；加入清单仅作统一浏览，不自动应用。' + cartHint,'major'))
 + pane('ok', listOf(uptodate,'grey','已位于最新可用版本，无需升级。按当前版本发布时间从旧到新排序——长期未变动的可评估是否替换为更活跃的组件。',''))
 + pane('other', (others.length? others.map(it=>card(it,'grey','')).join('') : `<div class="empty"><div class="big">🎉</div>没有异常项</div>`));

const app=document.getElementById('app');
app.innerHTML = renderOverview()
  + renderTop5()
  + renderPriority()
  + tabBar
  + panes
  + renderUnreachable()
  + renderLongTerm();

// window-scoped so inline onclick handlers can reach it
window.switchTab = function(k){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.t===k));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.id==='pane-'+k));
};

// ---- export (static, reusable copy) ---------------------------------------
// Serializes the CURRENT rendered page into a standalone .html the user can save
// and reopen anywhere. The exported file re-runs the same script with
// APPLY=null, so it re-renders cleanly WITHOUT any "apply upgrade" buttons
// (those need the server's token/endpoint and would 404 in a file:// page).
// Because mount() rebuilds #app from DATA, the pre-serialized DOM is replaced on
// open — no duplicate/interactive residue remains.
window.exportReport = function(){
  const out = document.documentElement.cloneNode(true);
  // 1) neutralise the apply config so the exported copy is strictly read-only.
  const dataJson = JSON.stringify(DATA).replace(/</g, '\\u003c');
  // 2) re-inject data + a null apply config into the embedded script source.
  // IMPORTANT: never write the literal template placeholders here — the python
  // generators replace those SUBSTRINGS globally with json.dumps(), so a literal
  // would be corrupted and break the script. Assemble them at runtime via concat.
  const P_D = '__REPORT' + '_DATA__';
  const P_A = '__APPLY' + '_CONFIG__';
  let html = '<!DOCTYPE html>\n' + out.outerHTML;
  html = html.replace(new RegExp('const DATA = ' + P_D + ';'), 'const DATA = ' + dataJson + ';')
             .replace(new RegExp('const APPLY = ' + P_A + ';'), 'const APPLY = null;');
  // 3) suggest a stable filename.
  const date = (DATA.generated_at || '').replace(/[-: ]/g, '').slice(0, 8) || 'report';
  const name = `dep-report-${date}.html`;
  const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 300);
  // brief feedback on the button itself
  const btn = document.querySelector('.export-btn');
  if(btn){ const old = btn.textContent; btn.textContent = '✓ 已导出 ' + name;
    setTimeout(()=>{ btn.textContent = old; }, 2000); }
};
// Open the highest-risk non-empty upgrade tab first; fall back to any non-empty.
// tabsDef = [key, label, count]; count is at index 2.
const firstNonEmpty = tabsDef.slice(0,3).find(([, ,n])=>n>0)
  || tabsDef.find(([, ,n])=>n>0) || tabsDef[0];
switchTab(firstNonEmpty[0]);
// initialise cart pick state (boxes enabled, badges default) after mount
syncPickState();

// copy handlers (delegated)
document.addEventListener('click', e=>{
  const b=e.target.closest('.copy'); if(!b) return;
  e.stopPropagation();
  const text=decodeURIComponent(escape(atob(b.dataset.cmd)));
  navigator.clipboard.writeText(text).then(()=>{
    b.textContent='已复制'; b.classList.add('done');
    setTimeout(()=>{b.textContent='复制';b.classList.remove('done');},1500);
  });
});

// copy dependency coordinate (groupId:artifactId) from the header button.
function copyCoord(btn){
  const text=btn.dataset.copy||'';
  navigator.clipboard.writeText(text).then(()=>{
    const old=btn.textContent;
    btn.textContent='✓'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='⧉ 坐标';btn.classList.remove('done');},1500);
  }).catch(()=>{ btn.textContent='失败'; });
}

// expand/collapse: click anywhere on a card toggles it, except interactive
// controls (links, buttons, copy, apply actions) which handle their own clicks.
document.addEventListener('click', e=>{
  if(e.target.closest('a, button, .cmd, .apply-actions')) return;
  const item=e.target.closest('.item'); if(!item) return;
  item.classList.toggle('open');
});
</script>
