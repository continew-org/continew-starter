name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          cache-read-only: true
      - name: Lint workflows
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -shellcheck= .github/workflows/*.yml
      - name: Test workflow contracts
        run: node --test scripts/ci/workflows.test.cjs
      - name: Build and verify
        # verify 触发完整门禁：Enforcer -> Spotless check -> Checkstyle (validate) -> 编译 -> 单元测试 (test) -> SpotBugs (verify)
        run: ./mvnw -B verify
      - name: Check configuration reference drift
        # 编译生成 spring-configuration-metadata.json 后，校验配置参考没有失效键或漏项
        run: python3 scripts/check-doc-properties.py
      - name: Check contract test coverage
        # 校验每个声明自动配置的模块都有同名装配契约测试，防止契约测试被静默移除
        run: python3 scripts/check-contract-tests.py
