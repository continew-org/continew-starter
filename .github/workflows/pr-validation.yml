name: PR Validation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            dependencies
            bom
            core
            json
            api-doc
            validation
            web
            cache
            auth
            data
            encrypt
            security
            ratelimiter
            idempotent
            trace
            captcha
            messaging
            log
            excel
            storage
            license
            extension
          requireScope: false
          # if true, the PR title must match the commit message
          validateSingleCommit: false
          # if true, the PR title must match the single commit message
          validateSingleCommitMatchesPrTitle: false
      - name: Fetch trusted template and validator
        if: github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
        # 特权上下文不检出仓库代码：按触发本次运行的 workflow 提交取文件，且不写入凭据。
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr-body"
          fetch() {
            local path="$1"
            mkdir -p "$root/$(dirname "$path")"
            gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=${TRUSTED_SHA}" \
              -H 'Accept: application/vnd.github.raw' > "$root/$path"
            test -s "$root/$path"
          }
          fetch .github/PULL_REQUEST_TEMPLATE.md
          fetch scripts/ci/validate-pr-body.cjs
      - name: Validate PR body against template
        if: github.event.pull_request.user.type != 'Bot'
        working-directory: ${{ runner.temp }}/pr-body
        run: node scripts/ci/validate-pr-body.cjs

  check-commit-authors:
    name: Verify commit author emails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # edited 也必须给出实际结果，不能用同名 skipped 检查覆盖尚未修复的失败。
    if: github.event.pull_request.user.type != 'Bot'
    permissions:
      pull-requests: write
    steps:
      - name: Check commit authors linked to GitHub
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // listCommits 最多返回 250 条；未取得完整提交列表时不能放行。
            if (commits.length !== context.payload.pull_request.commits) {
              core.setFailed('未取得完整的 PR 提交列表，无法确认所有作者邮箱。请检查提交数并重试。');
              return;
            }
            const unlinked = commits.filter(c => !c.author);
            const details = unlinked.map(c => `\`${c.sha.slice(0, 7)}\``).join('、');

            const body = [
              '### ⚠️ 提交作者校验未通过',
              '',
              '以下提交的作者邮箱**未绑定任何 GitHub 账号**，',
              '这将导致 CLA 无法签署，进而阻塞 PR 合并。',
              '',
              '涉及提交：' + details,
              '',
              '**修复方式：**',
              '1. 将该邮箱添加到你的 GitHub 账号：https://github.com/settings/emails',
              '2. 或将本地 git 配置改为已绑定 GitHub 的邮箱：',
              '   ```',
              '   git config user.name "你的 GitHub 用户名"',
              '   git config user.email "your-github-email@example.com"',
              '   ```',
              '3. 修订提交并强推：',
              '   ```',
              '   git rebase -i ' + context.payload.pull_request.base.sha + ' # 将待修订提交标记为 edit',
              '   git push --force-with-lease',
              '   ```',
              '',
              '*推送后本校验会自动重新运行。*',
            ].join('\n');

            const marker = '<!-- pr-validation-author-check -->';
            const existingComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = existingComments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (!existing && !unlinked.length) return;
            const commentBody = marker + '\n' + (unlinked.length ? body : '所有提交的作者邮箱均已绑定 GitHub 账号。');
            if (existing && existing.body !== commentBody) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else if (!existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

            if (unlinked.length) {
              core.setFailed(`${unlinked.length} 个提交的作者邮箱未绑定 GitHub 账号，修复方式见 PR 评论。`);
            }
