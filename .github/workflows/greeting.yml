name: Greeting

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: greeting-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  welcome:
    name: Greet first-time contributor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Greet first-time contributor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const item = pr ?? context.payload.issue;
            const author = item.user;
            const external = ['NONE', 'FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR', 'CONTRIBUTOR'];
            if (author?.type !== 'User' || typeof author.login !== 'string' || !author.login.trim() ||
                !external.includes(item.author_association)) return;

            // Issue 与 PR 共用编号和列表；较大的编号不能否决先打开、稍后才处理的条目。
            for await (const { data } of github.paginate.iterator(github.rest.issues.listForRepo, {
              ...context.repo, creator: author.login, state: 'all', sort: 'created', direction: 'asc', per_page: 100
            })) {
              if (data.some(entry => entry.number < item.number)) return;
            }

            const marker = '<!-- continew-starter:greeting -->';
            const intro = pr ? `🎉 恭喜 @${author.login}，这是您对 ContiNew Starter 仓库的首次贡献！`
                             : `🙏 感谢 @${author.login} 向 ContiNew Starter 提交第一个 Issue！`;
            const params = { ...context.repo, issue_number: item.number };
            for await (const { data } of github.paginate.iterator(github.rest.issues.listComments, {
              ...params, per_page: 100
            })) {
              if (data.some(c => c.user?.login === 'github-actions[bot]' &&
                  (c.body?.startsWith(marker) || c.body?.startsWith(intro)))) return;
            }
            const guide = pr
              ? '提交前请对照 [贡献指南](https://github.com/continew-org/continew-starter/blob/dev/CONTRIBUTING.md) 检查格式与测试。'
              : '为便于跟进，请确认 Issue 已按模板填写版本号、复现步骤与期望结果。';
            await github.rest.issues.createComment({ ...params, body: `${marker}\n${intro}\n\n${guide}\n\n欢迎到[官网](https://continew.top/)了解社区交流方式。` });
